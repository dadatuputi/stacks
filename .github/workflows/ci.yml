name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: CLI smoke test (imports + --help)
        run: |
          stacks --help
          stacks auth --help
          stacks library --help
          stacks download --help
          stacks enrich --help
          stacks organize --help
          stacks pdfs --help
          stacks audit --help
